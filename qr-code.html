<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: antiquewhite;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main{
            width: 1000px;
            height: 700px;
            margin: auto;
            background-color: rgb(154 209 224);
            display: flex;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);      
        }
        .box{
            width: 90vw;
            max-width: 350px;
            height: 90vh;
            max-height: 530px;
            background-color: white;
            margin: auto;
            border-radius: 15px;
        

        }
       
        
        .img img{
            width: 325px;
            margin: 12px;
            height: 300px;
            border-radius: 15px;
        }
        .txt{
            justify-content: center;
            text-align: center;
        }
        .txt1{
            font-weight: 550;
            opacity: 0.8;
            font-size: 25px;
        }
        .txt2{
            padding: 8px;
            margin-left: 8px;
            margin-right: 8px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: 500;
            opacity: 0.5;
        }


    </style>
</head>
<body>
    <div class="main">

        <div class="box">
            <div class="img">
                <img src="image-qr-code.png" alt="">
            </div>
            <div class="txt">
                <div class="txt1">        Improve your frontend <br>skills by building projects</div>
                <div class="txt2">
                    Scan the qr code to visit frontend mentor and take your coding skills to the next level
                </div>
            </div>
        </div>
    </div>
</body>
</html>
